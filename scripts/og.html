<!DOCTYPE html>
<!-- Source for og.png. Render at 1200x630 with scripts/build-social.sh. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../assets/tailwind-4.3.3.css" />
  <style>
    /* Design system v2: newsprint paper, CMU Serif 700 wordmark with the ink
       block tilted +1.5deg, and the tagline on a halftone (dot) shadow. The dot
       geometry is scaled up for a 1200px card read at thumbnail size. */
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--surface-page); }
    .frame {
      box-sizing: border-box; width: 1200px; height: 630px; padding: 56px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 44px;
    }
    .wordmark {
      margin: 0;
      font: var(--weight-display) 196px/1.1 var(--font-display);
      letter-spacing: var(--tracking-display);
      color: var(--text-1);
      white-space: nowrap;
    }
    .tagline {
      --dot-pitch: 6px; --dot-radius: 2px; --shadow-offset: 10px;
      --border-width: 3px; --border: 3px solid var(--border-strong);
      margin: 0; padding: 14px 22px;
      font: var(--weight-bold) 28px/1.3 var(--font-mono);
      letter-spacing: var(--tracking-meta); text-transform: uppercase; color: var(--text-1);
    }
    /* A rendered image, not a screen: keep the round dots at 1x. */
    .tagline.cast::after { --dot-field: radial-gradient(circle at 50% 50%, var(--shadow-color) var(--dot-radius), transparent calc(var(--dot-radius) + 0.5px)); }
  </style>
</head>
<body>
  <div class="frame">
    <h1 class="wordmark">down<span class="ink-block tilt-cw">.blue</span></h1>
    <p class="tagline cast">A Bluesky (and Atmosphere) video downloader</p>
  </div>
</body>
</html>

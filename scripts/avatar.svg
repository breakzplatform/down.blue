<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Colours are the design system's ink-down, white and black tokens, inlined:
       an SVG loaded as an image cannot read CSS custom properties. -->
  <rect width="100" height="100" fill="#018281"/>
  <!-- Card plus its hard shadow spans 18..82 before scaling. Scaled down around the
       centre so its corners stay well inside Bluesky's circular crop. -->
  <g transform="translate(50 50) scale(0.85) translate(-50 -50)">
    <rect x="26" y="26" width="56" height="56" fill="#000"/>
    <rect x="18" y="18" width="56" height="56" fill="#000"/>
    <rect x="22" y="22" width="48" height="48" fill="#fff"/>
    <path d="M46 29v22M34 41l12 12 12-12M32 63h28" fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="square"/>
  </g>
</svg>

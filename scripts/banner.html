<!DOCTYPE html>
<!-- Source for banner.png, the @down.blue profile banner (3000x1000). Render with
     scripts/build-social.sh. Bluesky lays the avatar over the bottom left corner,
     so the content sits right of centre and clear of it. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../assets/tailwind-4.3.3.css" />
  <style>
    html, body { margin: 0; width: 3000px; height: 1000px; overflow: hidden; background: var(--surface-page); }
    .frame {
      box-sizing: border-box; width: 3000px; height: 1000px; padding: 0 200px 0 760px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 72px;
    }
    .tagline {
      --dot-pitch: 10px; --dot-radius: 3.5px; --shadow-offset: 18px;
      --border-width: 6px; --border: 6px solid var(--border-strong);
      margin: 0; padding: 44px 64px;
      font: var(--weight-bold) 64px/1.3 var(--font-mono); white-space: nowrap;
      letter-spacing: var(--tracking-meta); text-transform: uppercase; color: var(--text-1);
    }
    /* A rendered image, not a screen: keep the round dots at 1x. */
    .tagline.cast::after { --dot-field: radial-gradient(circle at 50% 50%, var(--shadow-color) var(--dot-radius), transparent calc(var(--dot-radius) + 0.5px)); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="tagline cast">A Bluesky (and Atmosphere) video downloader</p>
  </div>
</body>
</html>

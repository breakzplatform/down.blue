# No bundler/build: Netlify just publishes the repo root. The "command" runs
# at deploy time only to prune files that should not be served publicly
# (they stay in the Git repo, they just don't ship to the CDN).
[build]
  publish = "."
  command = "rm -rf scripts netlify.toml .gitignore"

# Short link for the iOS Shortcut announcement post.
[[redirects]]
  from = "/ios"
  to = "https://bsky.app/profile/down.blue/post/3l534dn26xp2j"
  status = 302
